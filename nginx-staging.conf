# Staging – staging.kdynachatu.cz → chata-staging (port 3100), za heslem.
# Instalace: docs/plans/SEP-1-staging-setup.md. HTTPS doplní `certbot --nginx -d staging.kdynachatu.cz`.
server {
    listen 80;
    server_name staging.kdynachatu.cz;

    client_max_body_size 60M;

    auth_basic "Kdy na chatu – staging";
    auth_basic_user_file /etc/nginx/.htpasswd-staging;

    # Staging se nemá objevit ve vyhledávačích.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /sw.js {
        proxy_pass http://localhost:3100;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /index.html {
        proxy_pass http://localhost:3100;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /manifest.webmanifest {
        proxy_pass http://localhost:3100;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass http://localhost:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
